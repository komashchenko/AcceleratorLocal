; Boolean values must be true or false. Comments occupy their own lines.

; Generate missing symbol files.
; Cached symbols are still used when disabled.
GenerateSymbols = true

; Processing timeout in seconds, including symbol generation,
; stack walking and report writing. Must be at least 5.
ProcessorTimeoutSeconds = 30

; Include the full startup command line in the text report.
; May expose passwords and authentication tokens.
IncludeCommandLine = true

; Include available console history in the text report.
IncludeConsoleHistory = true

; Maximum number of stack frames printed to the server console.
; Set to 0 to disable console stack output.
; Does not limit the full text report.
ConsoleStackFrames = 15

; Delete minidumps and their text reports older than this many days.
; Set to 0 to disable automatic deletion. The symbol cache is never deleted.
; Cleanup runs only when the plugin starts. No periodic cleanup is performed.
DumpRetentionDays = 0
